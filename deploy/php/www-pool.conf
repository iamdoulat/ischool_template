; ==============================================================================
; iSchool PHP-FPM Pool Configuration (www.conf)
; Location: /etc/php/8.2/fpm/pool.d/www.conf
; Tuned for 4GB - 16GB VPS Instances (200 - 5000 Students)
; ==============================================================================

[www]
user = www-data
group = www-data

listen = /var/run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management Mode
pm = dynamic

; --- Tier 1 (4 GB RAM / 2 vCPU): 200 - 500 Students ---
; pm.max_children = 30
; pm.start_servers = 8
; pm.min_spare_servers = 5
; pm.max_spare_servers = 15

; --- Tier 2 (8 GB RAM / 4 vCPU): 500 - 1000 Students (Default) ---
pm.max_children = 60
pm.start_servers = 15
pm.min_spare_servers = 10
pm.max_spare_servers = 30

; --- Tier 3 (16 GB RAM / 8 vCPU): 1000 - 5000 Students ---
; pm.max_children = 120
; pm.start_servers = 30
; pm.min_spare_servers = 20
; pm.max_spare_servers = 60

pm.max_requests = 1000
pm.process_idle_timeout = 10s

; Timeouts & Resource Limits
request_terminate_timeout = 120s
rlimit_files = 65536
rlimit_core = 0

; PHP INI Overrides
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
